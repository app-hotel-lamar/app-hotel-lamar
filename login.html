<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Hotel Boutique La Mar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm p-4" style="max-width: 400px; margin: auto;">
            <h2 class="text-center mb-4 text-primary">Hotel Boutique La Mar</h2>
            <p class="text-center text-muted">Acceso exclusivo para huéspedes</p>
            
            <form id="loginForm">
                <div class="mb-3">
                    <label for="habitacion" class="form-label">Habitación</label>
                    <input type="text" class="form-control" id="habitacion" placeholder="Ej: 101" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña (recibida en check-in)</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar a la App</button>
            </form>
            <p id="mensajeLogin" class="mt-3 text-center text-danger"></p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
