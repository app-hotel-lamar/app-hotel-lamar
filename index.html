<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App - Hotel Boutique La Mar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Hotel La Mar</a>
            <span class="navbar-text">Habitación: <span id="numHabitacion"></span></span>
            <button id="btnLogout" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Bienvenido a tu App del Hotel</h2>
        <p>Aquí tienes acceso a todos los servicios durante tu estancia.</p>

        <!-- Mapa -->
        <section id="mapa" class="mt-4">
            <h3>Mapa del Hotel</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.835!2d-0.376!3d39.4699!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMznCsDI4JzExLjciTiAwwrAyMicwMS45Ilc!5e0!3m2!1ses!2ses" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </section>

        <!-- Servicios -->
        <section id="servicios" class="mt-5">
            <h3>Servicios</h3>
            <ul class="list-group">
                <li class="list-group-item">WiFi gratuito</li>
                <li class="list-group-item">Piscina infinity</li>
                <li class="list-group-item">Spa y masajes</li>
                <li class="list-group-item">Desayuno mediterráneo</li>
            </ul>
        </section>

        <!-- Alquiler -->
        <section id="alquiler" class="mt-5">
            <h3>Alquiler de Sombrillas y Toallas</h3>
            <form id="formAlquiler">
                <div class="mb-3">
                    <label>Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" min="1" required>
                </div>
                <button type="submit" class="btn btn-success">Solicitar</button>
            </form>
            <p id="mensajeAlquiler" class="mt-2"></p>
        </section>

        <!-- Desayuno -->
        <section id="desayuno" class="mt-5">
            <h3>Reserva de Desayuno</h3>
            <form id="formDesayuno">
                <div class="mb-3">
                    <label>Fecha</label>
                    <input type="date" class="form-control" id="fecha" required>
                </div>
                <button type="submit" class="btn btn-success">Reservar</button>
            </form>
            <p id="mensajeDesayuno" class="mt-2"></p>
        </section>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
